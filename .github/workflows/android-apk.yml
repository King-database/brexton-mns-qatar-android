
name: BREXTON MnS Qatar Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BREXTON MnS Qatar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          mkdir -p app-source
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d app-source

          echo "Extracted project files:"
          find app-source -maxdepth 3 -type f | head -n 100

      - name: Locate Capacitor project
        shell: bash
        run: |
          PROJECT_DIR=""

          if [ -f app-source/package.json ]; then
            PROJECT_DIR="app-source"
          else
            PROJECT_DIR=$(find app-source -name package.json \
              -not -path "*/node_modules/*" \
              -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json not found in ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Install project dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm install --save-dev typescript

      - name: Verify Capacitor configuration
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            echo "ERROR: Capacitor configuration not found."
            exit 1
          fi

      - name: Prepare Android platform
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brexton-mns-qatar-android-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
