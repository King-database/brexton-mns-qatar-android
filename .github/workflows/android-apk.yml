
name: BREXTON MnS Qatar Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract uploaded ZIP
        run: |
          mkdir -p app-source
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d app-source
          echo "Extracted $ZIP_FILE"
          find app-source -maxdepth 3 -type f | head -n 80

      - name: Locate Android project
        run: |
          if [ -f app-source/package.json ]; then
            PROJECT_DIR="app-source"
          else
            PROJECT_DIR=$(find app-source -name package.json -not -path "*/node_modules/*" -printf '%h\n' | head -n 1)
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find package.json in ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

            - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm install --save-dev typescript

      - name: Prepare Android project
        run: |
          cd "$PROJECT_DIR"
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brexton-mns-qatar-android-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
